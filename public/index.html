<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Fleet Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #f6f7f4;
      --bg-2: #d7e8dd;
      --card: rgba(255, 255, 255, 0.72);
      --text: #132518;
      --muted: #4c6254;
      --online: #0f9d58;
      --offline: #c94a3f;
      --accent: #0b7d77;
      --shadow: 0 14px 40px rgba(14, 43, 29, 0.14);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(16, 125, 90, 0.24), transparent 42%),
        radial-gradient(circle at 84% 8%, rgba(12, 103, 132, 0.2), transparent 38%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .wrap {
      width: min(1100px, 100%);
      display: grid;
      gap: 18px;
      animation: rise 0.6s ease;
    }

    .hero {
      border-radius: var(--radius);
      background: linear-gradient(120deg, rgba(255,255,255,0.86), rgba(240,251,246,0.82));
      box-shadow: var(--shadow);
      padding: 20px;
      border: 1px solid rgba(19, 37, 24, 0.08);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2.7vw, 2.3rem);
      font-family: "Sora", sans-serif;
      letter-spacing: 0.3px;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .alert-banner {
      display: none;
      border-radius: var(--radius);
      padding: 14px 18px;
      background: linear-gradient(120deg, rgba(201, 74, 63, 0.15), rgba(255, 239, 233, 0.95));
      border: 1px solid rgba(201, 74, 63, 0.35);
      color: #8f251c;
      font-weight: 700;
      box-shadow: var(--shadow);
      animation: pop 0.45s ease forwards;
    }

    .alert-banner.show {
      display: block;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(19, 37, 24, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transform: translateY(8px);
      opacity: 0;
      animation: pop 0.7s ease forwards;
    }

    .card:nth-child(2) { animation-delay: 0.12s; }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .name {
      margin: 0;
      font-family: "Sora", sans-serif;
      font-size: 1.1rem;
    }

    .pill {
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: white;
    }

    .online { background: var(--online); }
    .offline { background: var(--offline); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .metric {
      background: rgba(255, 255, 255, 0.65);
      border-radius: 14px;
      padding: 10px;
      border: 1px solid rgba(19, 37, 24, 0.06);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 4px;
    }

    .metric strong {
      font-size: 0.98rem;
      font-weight: 700;
    }

    .event {
      margin-top: 12px;
      background: rgba(11, 125, 119, 0.09);
      border: 1px dashed rgba(11, 125, 119, 0.45);
      border-radius: 12px;
      padding: 10px;
      color: #134f4b;
      font-size: 0.88rem;
      min-height: 42px;
    }

    .control {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(17, 66, 49, 0.07);
      border: 1px solid rgba(19, 37, 24, 0.1);
    }

    .control-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .speed-value {
      font-weight: 700;
      color: var(--text);
    }

    .speed-slider {
      width: 100%;
      accent-color: var(--accent);
      margin-bottom: 10px;
    }

    .dir-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .dir-btn {
      border: none;
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.9);
      color: #194732;
      border: 1px solid rgba(25, 71, 50, 0.2);
    }

    .dir-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }

    .dir-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .control-note {
      margin: 8px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 16px;
    }

    .foot {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 2px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Smart Vehicle Fleet Dashboard</h1>
      <p>Live online/offline status and telemetry for Vehicle 1 and Vehicle 2.</p>
    </section>

    <section class="alert-banner" id="vehicleAlert" role="alert" aria-live="polite"></section>

    <section class="cards" id="cards"></section>
    <div class="foot" id="updated">Last updated: -</div>
  </main>

  <script>
    const cardsEl = document.getElementById("cards");
    const updatedEl = document.getElementById("updated");
    const vehicleAlertEl = document.getElementById("vehicleAlert");

    function fmt(value, fallback = "-") {
      return value === null || value === undefined || value === "" ? fallback : value;
    }

    function isObstacleEvent(eventText) {
      return /collision warning|obstacle/i.test(eventText || "");
    }

    function renderVehicle(v) {
      const statusClass = v.isOnline ? "online" : "offline";
      const statusText = v.isOnline ? "ONLINE" : "OFFLINE";
      const selectedSpeed = Number.isFinite(v.desiredSpeedPwm) && v.desiredSpeedPwm > 0 ? v.desiredSpeedPwm : 180;
      const selectedDirection = typeof v.desiredDirection === "string" ? v.desiredDirection : "stop";

      const directionButton = (dir, label) => `
        <button
          type="button"
          class="dir-btn ${selectedDirection === dir ? "active" : ""}"
          data-vehicle-id="${v.id}"
          data-control-dir="${dir}"
        >${label}</button>
      `;

      return `
        <article class="card">
          <div class="head">
            <h2 class="name">${v.name}</h2>
            <span class="pill ${statusClass}">${statusText}</span>
          </div>

          <div class="grid">
            <div class="metric"><span>IP</span><strong>${fmt(v.ip)}</strong></div>
            <div class="metric"><span>Battery</span><strong>${fmt(v.battery)}%</strong></div>
            <div class="metric"><span>Distance</span><strong>${fmt(v.distanceCm)} cm</strong></div>
            <div class="metric"><span>Speed PWM</span><strong>${fmt(v.speedPwm)}</strong></div>
            <div class="metric"><span>Direction</span><strong>${fmt(v.direction, "-").toUpperCase()}</strong></div>
            <div class="metric"><span>Target Direction</span><strong>${fmt(v.desiredDirection, "-").toUpperCase()}</strong></div>
            <div class="metric"><span>Avg Accel</span><strong>${fmt(v.accel)}</strong></div>
            <div class="metric"><span>Avg Gyro</span><strong>${fmt(v.gyro)}</strong></div>
            <div class="metric"><span>Motor</span><strong>${v.motorRunning ? "RUNNING" : "STOPPED"}</strong></div>
            <div class="metric"><span>Emergency</span><strong>${v.emergencyMode ? "ON" : "OFF"}</strong></div>
          </div>

          <div class="control">
            <div class="control-top">
              <span>Dashboard Control</span>
              <span class="speed-value" id="speed-value-${v.id}">${selectedSpeed}</span>
            </div>
            <input
              type="range"
              min="0"
              max="255"
              step="1"
              value="${selectedSpeed}"
              class="speed-slider"
              data-speed-slider="${v.id}"
            />
            <div class="dir-buttons">
              ${directionButton("forward", "FORWARD")}
              ${directionButton("reverse", "REVERSE")}
              ${directionButton("stop", "STOP")}
            </div>
            <p class="control-note" id="control-note-${v.id}"></p>
          </div>

          <div class="event">${fmt(v.lastEvent, "No events yet")}</div>
        </article>
      `;
    }

    function setText(root, selector, value) {
      const el = root.querySelector(selector);
      if (el) {
        el.textContent = value;
      }
    }

    function upsertVehicleCard(v) {
      let card = cardsEl.querySelector(`[data-vehicle-card="${v.id}"]`);

      if (!card) {
        const html = renderVehicle(v).replace("<article class=\"card\">", `<article class=\"card\" data-vehicle-card=\"${v.id}\">`);
        cardsEl.insertAdjacentHTML("beforeend", html);
        card = cardsEl.querySelector(`[data-vehicle-card="${v.id}"]`);
      }

      if (!card) return;

      const statusClass = v.isOnline ? "online" : "offline";
      const statusText = v.isOnline ? "ONLINE" : "OFFLINE";
      const selectedSpeed = Number.isFinite(v.desiredSpeedPwm) && v.desiredSpeedPwm > 0 ? v.desiredSpeedPwm : 180;
      const selectedDirection = typeof v.desiredDirection === "string" ? v.desiredDirection : "stop";

      setText(card, ".name", fmt(v.name));

      const pill = card.querySelector(".pill");
      if (pill) {
        pill.classList.remove("online", "offline");
        pill.classList.add(statusClass);
        pill.textContent = statusText;
      }

      const metricValues = card.querySelectorAll(".grid .metric strong");
      if (metricValues.length >= 10) {
        metricValues[0].textContent = fmt(v.ip);
        metricValues[1].textContent = `${fmt(v.battery)}%`;
        metricValues[2].textContent = `${fmt(v.distanceCm)} cm`;
        metricValues[3].textContent = fmt(v.speedPwm);
        metricValues[4].textContent = fmt(v.direction, "-").toUpperCase();
        metricValues[5].textContent = fmt(v.desiredDirection, "-").toUpperCase();
        metricValues[6].textContent = fmt(v.accel);
        metricValues[7].textContent = fmt(v.gyro);
        metricValues[8].textContent = v.motorRunning ? "RUNNING" : "STOPPED";
        metricValues[9].textContent = v.emergencyMode ? "ON" : "OFF";
      }

      const slider = card.querySelector(`[data-speed-slider="${v.id}"]`);
      if (slider && document.activeElement !== slider) {
        slider.value = String(selectedSpeed);
      }

      const speedValue = document.getElementById(`speed-value-${v.id}`);
      if (speedValue && (!slider || document.activeElement !== slider)) {
        speedValue.textContent = String(selectedSpeed);
      }

      card.querySelectorAll("[data-control-dir]").forEach((btn) => {
        btn.classList.toggle("active", btn.getAttribute("data-control-dir") === selectedDirection);
      });

      const eventEl = card.querySelector(".event");
      if (eventEl) {
        eventEl.textContent = fmt(v.lastEvent, "No events yet");
      }
    }

    async function sendControl(vehicleId, direction) {
      const slider = cardsEl.querySelector(`[data-speed-slider="${vehicleId}"]`);
      const note = document.getElementById(`control-note-${vehicleId}`);
      const requestedSpeed = Number(slider?.value ?? 180);
      const speedPwm = direction === "stop" ? 0 : Math.max(80, requestedSpeed);

      if (note) {
        note.textContent = "Sending command...";
      }

      try {
        const response = await fetch(`/api/vehicle/${vehicleId}/control`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ direction, speedPwm })
        });

        if (!response.ok) {
          throw new Error("Command failed");
        }

        if (note) {
          note.textContent = `Command sent: ${direction.toUpperCase()} @ ${speedPwm}`;
        }
      } catch (error) {
        if (note) {
          note.textContent = "Failed to send command. Check server connection.";
        }
      }
    }

    async function refresh() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        const data = await response.json();

        data.vehicles.forEach((vehicle) => upsertVehicleCard(vehicle));

        const ids = new Set(data.vehicles.map((v) => v.id));
        cardsEl.querySelectorAll("[data-vehicle-card]").forEach((card) => {
          const id = card.getAttribute("data-vehicle-card");
          if (!ids.has(id)) {
            card.remove();
          }
        });

        const vehicle1 = data.vehicles.find((v) => v.id === "vehicle1");
        if (vehicle1 && isObstacleEvent(vehicle1.lastEvent)) {
          vehicleAlertEl.textContent = `Alert: Vehicle 1 obstacle detected. ${vehicle1.lastEvent}`;
          vehicleAlertEl.classList.add("show");
        } else {
          vehicleAlertEl.textContent = "";
          vehicleAlertEl.classList.remove("show");
        }

        updatedEl.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        updatedEl.textContent = "Server unreachable. Retrying...";
      }
    }

    cardsEl.addEventListener("input", (event) => {
      const slider = event.target.closest("[data-speed-slider]");
      if (!slider) return;
      const vehicleId = slider.getAttribute("data-speed-slider");
      const valueEl = document.getElementById(`speed-value-${vehicleId}`);
      if (valueEl) {
        valueEl.textContent = slider.value;
      }
    });

    cardsEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-control-dir]");
      if (!button) return;

      const vehicleId = button.getAttribute("data-vehicle-id");
      const direction = button.getAttribute("data-control-dir");
      if (!vehicleId || !direction) return;

      sendControl(vehicleId, direction);
    });

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
